  :root {

    --ink: #17203A;

  @media (prefers-color-scheme: dark) {

      --grid: #1C2542;

      --info-bg: #222D5A;
      --mark: #6A5A14;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101528;
    --grid: #1C2542;
    --surface: #182040;
    --surface-2: #1F294F;
    --ink: #E8ECF8;
